<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | My Salon</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <nav>

            <div class="logo">
                <a href="index.html">My Salon</a>
            </div>

            <div class="nav-links">
                <a href="index.html">View Website</a>
            </div>

        </nav>
    </header>


    <main>

        <section class="admin-login">

            <div class="admin-login-box">

                <h1>Admin Login</h1>

                <p>Login to manage your salon website.</p>


                <form id="admin-login-form">

                    <div class="admin-form-group">

                        <label for="admin-email">
                            Email
                        </label>

                        <input type="email" id="admin-email" placeholder="Enter admin email" required>

                    </div>


                    <div class="admin-form-group">

                        <label for="admin-password">
                            Password
                        </label>

                        <input type="password" id="admin-password" placeholder="Enter password" required>

                    </div>


                    <button type="submit" id="admin-login-btn">
                        Login
                    </button>


                    <p id="login-message"></p>

                </form>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>

    <script src="../js/login.js"></script>

</body>

</html>
